[package]
name = "jx"
version = "0.1.0"
edition = "2021"
description = "Small, opinionated extensions for everyday jj workflows."
license = "MIT OR Apache-2.0"

[dependencies]
async-trait = "0.1.89"
chrono = "0.4"
clap = "4.6.1"
clap_complete = "4.6.1"
dialoguer = "0.12.0"
futures = "0.3"
gix = { version = "0.83.0", default-features = false, features = ["sha1"] }
globset = "0.4.18"
indicatif = "0.18.4"
jj-cli = "0.41.0"
jj-lib = "0.41.0"
keyring = { version = "3.6.3", features = ["apple-native", "crypto-rust", "linux-native-sync-persistent", "windows-native"] }
octocrab = "0.49.9"
pollster = "0.4.0"
regex = "1.12.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3.18"
tempfile = "3.27.0"
termimad = "0.34.1"
terminal_size = "0.4.4"
thiserror = "2.0.18"
tokio = { version = "1", features = ["rt", "time"] }
toml = "1.1.2"
