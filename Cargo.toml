[package]
name = "jx"
version = "0.1.0"
edition = "2021"
description = "Small, opinionated extensions for everyday jj workflows."
license = "MIT OR Apache-2.0"

[dependencies]
async-trait = "0.1.89"
chrono = "0.4.45"
clap = "4.6.2"
clap_complete = "4.6.7"
dialoguer = "0.12.0"
futures = "0.3.33"
gix = { version = "0.85.0", default-features = false, features = ["sha1"] }
globset = "0.4.19"
indicatif = "0.18.6"
jj-cli = "0.43.0"
jj-lib = "0.43.0"
keyring = { version = "4.1.5", features = ["linux-keyutils-keyring-store"] }
octocrab = "0.54.0"
pollster = "1.0.1"
regex = "1.13.1"
rusqlite = "0.40.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"
signal-hook = "0.4.4"
tempfile = "3.27.0"
termimad = "0.35.1"
terminal_size = "0.4.4"
thiserror = "2.0.18"
tokio = { version = "1.53.0", features = ["rt", "time"] }
toml = "1.1.3"
